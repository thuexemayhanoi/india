name: Hindi site static QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/hindi-site-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static Hindi pages
        run: node scripts/build.mjs
      - name: Validate Hindi URLs, links, metadata, CNAME and sitemap
        run: node tests/qa.mjs
      - name: Test both floating widgets, Hindi assistant, contacts and site search
        run: |
          node --check assets/site.js
          node --check assets/js/floating-port.js
          node --check assets/js/assistant.js
          node --check assets/js/business-config.js
          node tests/floating-qa.mjs
      - name: Validate Smart Search, previous/next and publisher box
        run: |
          node --check assets/js/site-search.js
          node tests/reader-ux.mjs
      - name: Check generated HTML matches committed source
        run: |
          git diff --exit-code -- '*.html' 'sitemap.xml' 'robots.txt' 'assets/chat/search-index.json' 'assets/search/index.json'

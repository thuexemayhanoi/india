name: Hindi AI Local index one-time bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hindi-chat-index-bootstrap.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: hindi-factory-publisher
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Rebuild full-text Hindi assistant index from published posts only
        run: |
          node scripts/factory-preflight.mjs
          node scripts/build.mjs
          node tests/floating-qa.mjs
      - name: Commit the index only
        id: commit
        run: |
          set -euo pipefail
          git config user.name "india-index-bot"
          git config user.email "247212094+india-index-bot@users.noreply.github.com"
          git add assets/chat/search-index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "index(hi): refresh AI Local knowledge of published Hindi posts"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages rebuild after token-based commit
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 2 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"

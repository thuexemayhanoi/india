name: India Hindi Breadcrumb One-time Rebuild
on:
  push:
    branches: [fix/hi-breadcrumb-label-production-20261014]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild 300 articles and QA twice
        run: |
          node scripts/build.mjs
          node tests/qa.mjs
          node tests/floating-qa.mjs
          node tests/reader-ux.mjs
          node scripts/build.mjs
          node tests/reader-ux.mjs
          node --check assets/js/site-search.js
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' 'assets/chat/search-index.json' 'assets/search/index.json' 'sitemap.xml' 'robots.txt'
          if ! git diff --cached --quiet; then
            git commit -m "build(hi): apply fixed breadcrumb labels across all published pages"
            git push origin HEAD:fix/hi-breadcrumb-label-production-20261014
          fi
